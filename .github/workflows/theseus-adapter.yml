name: THESEUS adapter tests

on:
  pull_request:
    paths:
      - "script/preprocess/prepare_theseus.py"
      - "tests/test_theseus_adapter.py"
      - "requirements-theseus.txt"
      - "docs/theseus.md"
      - ".github/workflows/theseus-adapter.yml"

jobs:
  conversion-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=1.22,<3" "huggingface_hub>=0.24" "safetensors>=0.4"
      - run: python -m unittest discover -s tests -v

  training-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=1.22,<3" "huggingface_hub>=0.24" "safetensors>=0.4"
      - run: python -m pip install "torch>=2.3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
        env:
          UHOP_SMOKE_TRAINING: "1"
